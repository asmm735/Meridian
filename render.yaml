services:
  - type: web
    name: meridian-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    name: meridian
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m reflex init && npm ci --prefix .web && python -m reflex run --env prod --frontend-port $PORT --backend-port $PORT --backend-host 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MERIDIAN_API_URL
        fromService:
          type: web
          name: meridian-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: MERIDIAN_SECURE_COOKIE
        value: "1"
