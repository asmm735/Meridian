services:
  - type: web
    name: meridian-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    name: meridian-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MERIDIAN_API_URL
        fromService:
          type: web
          name: meridian-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: MERIDIAN_SECURE_COOKIE
        value: "1"
